name: Multiplatform Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Targets: native/mobile+desktop, mobile, desktop, all, or comma-separated android,ios,macos,linux,windows,web"
        required: true
        default: "native"
      build_mode:
        description: "Flutter build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - profile
          - debug
      flutter_version:
        description: "Flutter version used by CI"
        required: true
        default: "3.44.1"
      android_target:
        description: "Android artifact type"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - appbundle
          - both
      android_apk_profile:
        description: "Android APK profile"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - split
          - universal
      full_version:
        description: "Required release version: display version + monotonic build number, for example 1.2.0+26061001."
        required: true
        default: ""

permissions:
  contents: read

env:
  ARTIFACT_NAME: Selune
  RELEASE_REPOSITORY: zyl140640/readbook-releases
  APPREAD_API_BASE_URL: https://www.sxyd.lltask.top/api
  APPREAD_READER_GATEWAY_BASE_URL: https://rust.lltask.top/api
  APPREAD_APP_NAME: selune
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android-linux-web
            label: Android, Linux, Web
            os: ubuntu-22.04
            supported_platforms: "android,linux,web"
          - id: apple
            label: iOS, macOS
            os: macos-15
            supported_platforms: "ios,macos"
          - id: windows
            label: Windows
            os: windows-latest
            supported_platforms: "windows"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        env:
          FULL_VERSION: ${{ inputs.full_version }}
        run: |
          set -euo pipefail
          if [[ ! "${FULL_VERSION}" =~ ^[0-9]+(\.[0-9]+){1,2}\+[0-9]+$ ]]; then
            echo "::error::full_version must look like 1.2.0+26061001."
            echo "::error::The part before + is the user-visible version; the part after + is the monotonic build number used by Android/iOS/macOS/desktop upgrades."
            exit 1
          fi

      - name: Resolve selected platforms
        id: platforms
        shell: bash
        env:
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
          SUPPORTED_PLATFORMS: ${{ matrix.supported_platforms }}
        run: |
          set -euo pipefail

          normalize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | tr ',' ' '
          }

          allowed=(all android ios macos linux windows web)
          expand_platform_token() {
            local token="$1"
            case "${token}" in
              native|mobile+desktop|mobile-desktop|mobile_desktop|mobile_and_desktop)
                echo "android ios macos linux windows"
                ;;
              mobile)
                echo "android ios"
                ;;
              desktop)
                echo "macos linux windows"
                ;;
              all)
                echo "all"
                ;;
              *)
                echo "${token}"
                ;;
            esac
          }

          contains_platform() {
            local needle="$1"
            shift
            local candidate
            for candidate in "$@"; do
              if [[ "${candidate}" == "${needle}" ]]; then
                return 0
              fi
            done
            return 1
          }

          read -r -a supported <<<"$(normalize "${SUPPORTED_PLATFORMS}")"
          read -r -a raw_requested <<<"$(normalize "${REQUESTED_PLATFORMS}")"
          requested=()
          for platform in "${raw_requested[@]}"; do
            read -r -a expanded <<<"$(expand_platform_token "${platform}")"
            requested+=("${expanded[@]}")
          done

          selected=()
          for platform in "${requested[@]}"; do
            if ! contains_platform "${platform}" "${allowed[@]}"; then
              echo "::error::Unsupported platform '${platform}'. Use native, mobile, desktop, all, android, ios, macos, linux, windows, or web."
              exit 1
            fi
          done

          if contains_platform "all" "${requested[@]}"; then
            selected=("${supported[@]}")
          else
            for platform in "${requested[@]}"; do
              if contains_platform "${platform}" "${supported[@]}" && ! contains_platform "${platform}" "${selected[@]+"${selected[@]}"}"; then
                selected+=("${platform}")
              fi
            done
          fi

          if [[ "${#selected[@]}" -eq 0 ]]; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "No selected platforms for this runner."
            exit 0
          fi

          selected_csv="$(IFS=,; echo "${selected[*]}")"
          echo "should_build=true" >> "${GITHUB_OUTPUT}"
          echo "selected=${selected_csv}" >> "${GITHUB_OUTPUT}"
          echo "Selected platforms: ${selected_csv}"

      - name: Setup Java
        if: steps.platforms.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: steps.platforms.outputs.should_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && steps.platforms.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config

      - name: Enable desktop targets
        if: steps.platforms.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v xcodebuild >/dev/null 2>&1; then
            xcodebuild -version
          fi
          flutter config --enable-linux-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop

      - name: Restore Android release signing files
        if: runner.os == 'Linux' && steps.platforms.outputs.should_build == 'true' && contains(steps.platforms.outputs.selected, 'android') && inputs.build_mode == 'release'
        shell: bash
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -f android/key.properties && -f android/app/appread-release.jks ]]; then
            echo "Android release signing files already exist in the workspace."
            exit 0
          fi

          if [[ -z "${ANDROID_KEY_PROPERTIES}" || -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Android release build requires secrets ANDROID_KEY_PROPERTIES and ANDROID_KEYSTORE_BASE64."
            echo "::error::ANDROID_KEY_PROPERTIES should match android/key.properties.example; ANDROID_KEYSTORE_BASE64 should be the base64 of android/app/appread-release.jks."
            exit 1
          fi

          mkdir -p android/app
          printf '%s\n' "${ANDROID_KEY_PROPERTIES}" > android/key.properties
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/appread-release.jks

      - name: Build selected platforms
        if: steps.platforms.outputs.should_build == 'true'
        shell: bash
        env:
          ANDROID_TARGET: ${{ inputs.android_target }}
          ANDROID_APK_PROFILE: ${{ inputs.android_apk_profile }}
          APPREAD_API_BASE_URL: ${{ env.APPREAD_API_BASE_URL }}
          APPREAD_READER_GATEWAY_BASE_URL: ${{ env.APPREAD_READER_GATEWAY_BASE_URL }}
          APPREAD_APP_NAME: ${{ env.APPREAD_APP_NAME }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
          FULL_VERSION: ${{ inputs.full_version }}
          BUILD_NAME: ""
          BUILD_NUMBER: ""
          BUILD_SEQUENCE: ""
          AUTO_BUILD_NUMBER: "1"
          BUILD_TIMEZONE: Asia/Shanghai
          OUTPUT_ROOT: build/unified_artifacts
          VERSION_PROMPT: "0"
          ALLOW_PARTIAL: "0"
        run: |
          set -euo pipefail
          ./scripts/build_unified_artifacts.sh "${{ steps.platforms.outputs.selected }}" "${{ inputs.build_mode }}"

      - name: Upload artifacts
        if: steps.platforms.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.id }}-${{ github.run_number }}
          path: build/unified_artifacts/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish public release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ success() && inputs.build_mode == 'release' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        env:
          FULL_VERSION: ${{ inputs.full_version }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          find downloaded-artifacts -type f \
            \( \
              -name "*.apk" -o \
              -name "*.aab" -o \
              -name "*.ipa" -o \
              -name "*.dmg" -o \
              -name "*.zip" -o \
              -name "*.tar.gz" -o \
              -name "manifest.txt" \
            \) -print0 | while IFS= read -r -d '' file; do
              base="$(basename "${file}")"
              if [[ "${base}" == "manifest.txt" ]]; then
                parent="$(basename "$(dirname "${file}")")"
                cp "${file}" "release-files/${parent}-manifest.txt"
              else
                cp "${file}" "release-files/${base}"
              fi
            done

          if ! find release-files -type f | grep -q .; then
            echo "::error::No release files found in downloaded artifacts."
            find downloaded-artifacts -type f | sort
            exit 1
          fi

          {
            echo "# ${ARTIFACT_NAME} ${FULL_VERSION}"
            echo
            echo "本次构建产物由 GitHub Actions 自动发布。"
            echo
            echo "版本：${FULL_VERSION}"
            echo
            echo "## 文件"
            find release-files -maxdepth 1 -type f -print | sort | sed 's#release-files/#- #'
          } > release-notes.md

          echo "Prepared release files:"
          find release-files -maxdepth 1 -type f -print | sort

      - name: Publish to public release repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          FULL_VERSION: ${{ inputs.full_version }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
          RELEASE_REPOSITORY: ${{ env.RELEASE_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Missing RELEASE_REPO_TOKEN secret. Create a token with Contents read/write permission for ${RELEASE_REPOSITORY}."
            exit 1
          fi

          release_tag="v${FULL_VERSION/+/-}"
          release_title="${ARTIFACT_NAME} ${FULL_VERSION}"

          gh release delete "${release_tag}" \
            --repo "${RELEASE_REPOSITORY}" \
            --yes \
            --cleanup-tag >/dev/null 2>&1 || true

          gh release create "${release_tag}" release-files/* \
            --repo "${RELEASE_REPOSITORY}" \
            --title "${release_title}" \
            --notes-file release-notes.md

          {
            echo "## Public release"
            echo
            echo "Repository: https://github.com/${RELEASE_REPOSITORY}"
            echo
            echo "Release: https://github.com/${RELEASE_REPOSITORY}/releases/tag/${release_tag}"
            echo
            echo "## Download links"
            gh api "repos/${RELEASE_REPOSITORY}/releases/tags/${release_tag}" \
              --jq '.assets[] | "- [\(.name)](\(.browser_download_url))"'
          } >> "${GITHUB_STEP_SUMMARY}"
