name: flutter_charset_detector_web
description: Web stub for flutter_charset_detector used by 书享阅读 web builds.
version: 1.2.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_charset_detector_platform_interface: ^1.1.0

flutter:
  plugin:
    implements: flutter_charset_detector
    platforms:
      web:
        pluginClass: CharsetDetectorWeb
        fileName: flutter_charset_detector_web.dart
