<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6750A4"/>
      <stop offset="100%" style="stop-color:#7F67BE"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8DEF8"/>
      <stop offset="100%" style="stop-color:#D0BCFF"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bookGradient)"/>
  
  <!-- Book Base -->
  <path d="M100 340 L100 180 C100 160 120 145 140 145 L256 160 L372 145 C392 145 412 160 412 180 L412 340 C412 360 392 375 372 375 L140 375 C120 375 100 360 100 340 Z" fill="#1D1B20"/>
  
  <!-- Left Page -->
  <path d="M110 175 L110 330 L250 340 L250 165 Z" fill="url(#pageGradient)" rx="8"/>
  
  <!-- Right Page -->
  <path d="M262 165 L262 340 L402 330 L402 175 Z" fill="url(#pageGradient)" rx="8"/>
  
  <!-- Left Page Lines -->
  <line x1="130" y1="200" x2="220" y2="205" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="230" x2="210" y2="235" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="260" x2="200" y2="264" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="290" x2="190" y2="293" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Right Page Lines -->
  <line x1="280" y1="205" x2="370" y2="200" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  <line x1="290" y1="235" x2="370" y2="230" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="264" x2="370" y2="260" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  <line x1="310" y1="293" x2="370" y2="290" stroke="#6750A4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Book Spine Shadow -->
  <rect x="248" y="160" width="16" height="185" fill="#1D1B20" rx="2"/>
</svg>
