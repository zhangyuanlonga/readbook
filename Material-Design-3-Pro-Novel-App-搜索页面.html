<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Design 3 Pro - Novel App - 搜索页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EADDFF;
            --md-on-primary-container: #21005D;
            --md-surface: #F7F2FA;
            --md-surface-variant: #E7E0EC;
            --md-on-surface: #1C1B1F;
            --md-outline: #79747E;
            --md-error-container: #F9DEDC;
            --md-on-error-container: #410E0B;
        }
        /* 调整 body 样式以居中显示单个手机容器 */
        body { 
            background: #e0e0e0; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 确保占据整个视口高度 */
            margin: 0;
            padding: 20px; /* 增加一些内边距 */
            box-sizing: border-box; /* 防止内边距导致溢出 */
        }
        
        /* 手机容器 */
        .phone-container {
            width: 360px; height: 760px; background: var(--md-surface);
            border-radius: 32px; overflow: hidden; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column;
        }

        /* 核心 MD3 组件 */
        .md-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .md-card-tonal { background: var(--md-surface-variant); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        
        .md-btn-filled { background: var(--md-primary); color: white; border-radius: 100px; padding: 10px 24px; font-weight: 500; font-size: 14px; }
        .md-btn-tonal { background: var(--md-primary-container); color: var(--md-on-primary-container); border-radius: 100px; padding: 10px 20px; font-size: 14px; }
        .md-btn-outline { border: 1px solid var(--md-outline); border-radius: 100px; padding: 10px 20px; font-size: 14px; }

        /* 悬浮导航栏 */
        .floating-nav {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 280px; height: 64px; background: #EEE8F4;
            border-radius: 32px; display: flex; align-items: center; justify-content: space-around;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #49454F; }
        .nav-item.active { color: var(--md-on-primary-container); }
        .nav-active-pill {
            background: var(--md-primary-container); width: 64px; height: 32px;
            border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
        }

        .scroll-area { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: none; }
        .scroll-area::-webkit-scrollbar { display: none; }
        
        .tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--md-surface-variant); margin-right: 4px; }
    </style>
</head>
<body>

    <!-- 2. 搜索页面 -->
    <div class="phone-container">
        <div class="p-4 flex items-center gap-4">
            <i class="fa-solid fa-arrow-left"></i>
            <h1 class="text-xl font-medium">搜索</h1>
        </div>

        <div class="scroll-area pt-0">
            <!-- 搜索框 -->
            <div class="md-card border border-[var(--md-outline)] !bg-transparent !p-1 flex items-center mb-2">
                <input type="text" value="剑来" class="flex-1 px-4 py-2 bg-transparent outline-none">
            </div>
            <div class="flex gap-2 mb-4">
                <button class="md-btn-filled flex-1 !py-2 text-xs">取消并重新搜索</button>
                <button class="md-btn-outline flex-1 !py-2 text-xs">清空结果</button>
            </div>

            <!-- 搜索进度 -->
            <div class="md-card-tonal !p-3">
                <div class="flex justify-between text-xs mb-2">
                    <span>正在搜索 4/5 个书源</span>
                    <span class="text-[var(--md-primary)]">80%</span>
                </div>
                <div class="w-full bg-gray-300 h-1 rounded-full overflow-hidden">
                    <div class="bg-[var(--md-primary)] h-full w-[80%]"></div>
                </div>
            </div>

            <!-- 错误提示（紧凑 MD3 风格） -->
            <div class="bg-[var(--md-error-container)] p-3 rounded-xl mb-4 text-[var(--md-on-error-container)]">
                <p class="text-xs font-bold"><i class="fa-solid fa-circle-exclamation mr-1"></i> 2个书源异常</p>
                <p class="text-[10px] opacity-80 mt-1">猫眼看书 (network error)...</p>
            </div>

            <!-- 结果列表 -->
            <div class="space-y-3">
                <div class="md-card !p-3 flex gap-3 border border-gray-100">
                    <div class="w-14 h-20 bg-gray-200 rounded flex-shrink-0 flex items-center justify-center text-[10px] text-gray-400">封面</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-sm">剑来</h4>
                        <div class="flex mt-1">
                            <span class="tag">球球浏览器</span>
                            <span class="tag">作者: 烽火...</span>
                        </div>
                        <p class="text-[10px] text-gray-500 mt-2 line-clamp-1 truncate w-40">最新章节: 第1396章</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-300 self-center"></i>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
